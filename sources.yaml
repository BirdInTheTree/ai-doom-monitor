# AI Doom Monitor — master source configuration
# See ../ai-doom-monitor-plan.md for rationale per tier
# Generated from inventory steps 01-03.

meta:
  version: 1
  updated: 2026-04-13

# -----------------------------------------------------------------------------
# FILTER STRATEGIES
# -----------------------------------------------------------------------------
# strict       — require BOTH ai_signal AND labor_signal in title (or one in
#                title + other in summary). Default for broad newsrooms.
# broad        — require only ai_signal OR only labor_signal. Use for sources
#                that are pre-specialized in one axis (AI-focused labs, or
#                labor-focused HR-trade).
# accept_all   — no filter. Use for curated on-topic newsletters where every
#                post is already in scope.
#
# KIND
# rss          — direct feed via url field
# gnews_site   — routed via Google News `site:` query (use when direct RSS
#                is blocked / deactivated / Cloudflare-protected)

# -----------------------------------------------------------------------------
# TIER 1  — top-authority newsrooms and research outlets (~31 sources)
# -----------------------------------------------------------------------------
