<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Doom Monitor — labor-market discourse</title>
<style>
  :root {
    --bg: #0e0e0e;
    --ink: #141414;
    --muted: #7a7a7a;
    --red: #c04848;
    --yellow: #9a9a9a;
    --green: #6a9b72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font: 14px/1.35 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .region-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(14, 14, 14, 0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-bottom: 1px solid #1f1f1f;
    padding: 10px 16px;
  }
  .region-bar-inner {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .region-btn {
    background: transparent;
    border: 1px solid #2a2a2a;
    color: #6a6a6a;
    font: inherit;
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.12s ease;
    letter-spacing: 0.02em;
  }
  .region-btn:hover {
    border-color: #444;
    color: #b0b0b0;
  }
  .region-btn.active {
    background: #1a1a1a;
    border-color: #555;
    color: #e8e8e8;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 0 80px;
  }
  .day-header {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 22px 16px 8px;
    font-weight: 500;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 7px 16px;
    min-height: 30px;
    color: var(--ink);
    text-decoration: none;
    border: none;
    transition: filter 0.1s ease;
  }
  .row:hover { filter: brightness(0.95); }
  .row .time {
    flex: 0 0 46px;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    opacity: 0.72;
  }
  .row .source {
    flex: 0 0 130px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.85;
  }
  .row .title {
    flex: 1;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .red    { background: var(--red); }
  .yellow { background: var(--yellow); }
  .green  { background: var(--green); }
  .archive {
    padding: 36px 16px 24px;
    border-top: 1px solid #232323;
    margin-top: 32px;
  }
  .archive-label {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding-bottom: 10px;
    font-weight: 500;
  }
  .stripe {
    display: flex;
    align-items: stretch;
    height: 20px;
    margin: 4px 0;
    gap: 10px;
  }
  .stripe .date {
    flex: 0 0 90px;
    font-size: 11px;
    color: var(--muted);
    line-height: 20px;
    font-variant-numeric: tabular-nums;
  }
  .stripe .date .total {
    color: #c8c8c8;
    margin-left: 6px;
    font-weight: 600;
  }
  .stripe .bar {
    flex: 1;
    display: flex;
    height: 20px;
    background: #1a1a1a;
  }
  .stripe .seg {
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #f5f5f5;
    font-variant-numeric: tabular-nums;
    overflow: hidden;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px;
    font-size: 12px;
  }
  /* Role heatmap */
  .heatmap {
    max-width: 880px;
    margin: 20px auto 32px;
    padding: 0 16px;
  }
  .heatmap-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .heatmap-title {
    color: #d8d8d8;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .heatmap-hint {
    color: var(--muted);
    font-size: 11px;
  }
  .heatmap-grid {
    display: grid;
    gap: 2px;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .hm-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 24px;
    cursor: pointer;
    background: #1a1a1a;
    color: #d8d8d8;
    border-radius: 2px;
    transition: outline 0.08s;
  }
  .hm-cell:hover {
    outline: 1px solid #7a7a7a;
  }
  .hm-cell.selected {
    outline: 1px solid #e8e8e8;
  }
  .hm-label-row {
    color: var(--muted);
    padding: 0 8px 0 0;
    text-align: right;
    white-space: nowrap;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .hm-label-col {
    color: var(--muted);
    text-align: center;
    font-size: 10px;
    padding: 0 0 4px 0;
  }
  .hm-corner { background: transparent; }
  .filter-pill {
    display: inline-block;
    margin-left: 12px;
    padding: 3px 10px;
    background: #2a2a2a;
    color: #e0e0e0;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
  }
  .filter-pill:hover { background: #3a3a3a; }
</style>
</head>
<body>
<nav class="region-bar">
  <div class="region-bar-inner" id="region-bar">
    <button class="region-btn active" data-region="US">🇺🇸 US</button>
    <button class="region-btn active" data-region="UK">🇬🇧 UK</button>
    <button class="region-btn active" data-region="EU">🇪🇺 EU</button>
    <button class="region-btn active" data-region="Asia">🌏 Asia</button>
    <button class="region-btn active" data-region="Global">🌐 Global</button>
  </div>
</nav>
<section class="heatmap" id="heatmap"></section>
<main id="feed"></main>
<script>
const RECENT_DAYS = 7;
const ROLES_ORDER = [
  ['CEO',              'CEO'],
  ['CFO',              'CFO'],
  ['CTO_CIO',          'CTO / CIO'],
  ['CMO',              'CMO'],
  ['middle_manager',   'middle mgr'],
  ['entry_level',      'entry-level'],
  ['engineer_ic',      'engineer / IC'],
  ['general_workforce','general'],
];
const activeRegions = new Set(['US', 'UK', 'EU', 'Asia', 'Global']);
let allArticles = [];
let roleFilter = null;   // {role, day} or null

fetch('articles.json')
  .then(r => r.json())
  .then(articles => { allArticles = articles; render(); })
  .catch(err => {
    document.getElementById('feed').innerHTML =
      '<div class="empty">failed to load articles.json — ' + err.message + '</div>';
  });

document.getElementById('region-bar').addEventListener('click', e => {
  const btn = e.target.closest('.region-btn');
  if (!btn) return;
  const r = btn.dataset.region;
  if (activeRegions.has(r)) {
    if (activeRegions.size === 1) return;
    activeRegions.delete(r);
    btn.classList.remove('active');
  } else {
    activeRegions.add(r);
    btn.classList.add('active');
  }
  render();
});

function matchesRegion(a) {
  if (!a.region) return true;
  return activeRegions.has(a.region);
}

function matchesRoleFilter(a) {
  if (!roleFilter) return true;
  const day = a.timestamp.slice(0, 10);
  if (day !== roleFilter.day) return false;
  return (a.roles || []).includes(roleFilter.role);
}

function render() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  const regionArticles = allArticles.filter(matchesRegion);
  renderHeatmap(regionArticles);
  const articles = regionArticles.filter(matchesRoleFilter);

  if (articles.length === 0) {
    feed.innerHTML = '<div class="empty">no articles match current filters</div>';
    return;
  }

  // group articles by local day key
  const byDay = {};
  for (const a of articles) {
    const d = new Date(a.timestamp);
    const key = dayKey(d);
    (byDay[key] = byDay[key] || []).push(a);
  }

  // sort articles within each day descending by timestamp (newest first)
  for (const key in byDay) {
    byDay[key].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  }

  // all days, newest first
  const days = Object.keys(byDay).sort().reverse();

  const recent = days.slice(0, RECENT_DAYS);
  const archive = days.slice(RECENT_DAYS);

  for (const day of recent) {
    feed.appendChild(dayHeader(day));
    for (const a of byDay[day]) {
      feed.appendChild(rowEl(a));
    }
  }

  if (archive.length) {
    const wrap = document.createElement('section');
    wrap.className = 'archive';
    const label = document.createElement('div');
    label.className = 'archive-label';
    label.textContent = 'Archive';
    wrap.appendChild(label);
    for (const day of archive) {
      wrap.appendChild(archiveStripe(day, byDay[day]));
    }
    feed.appendChild(wrap);
  }
}

function dayKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function dayHeader(key) {
  const el = document.createElement('div');
  el.className = 'day-header';
  const d = new Date(key + 'T12:00:00');
  el.textContent = d.toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric'
  });
  return el;
}

function rowEl(a) {
  const el = document.createElement('a');
  el.className = `row ${a.color}`;
  el.href = a.url;
  el.target = '_blank';
  el.rel = 'noopener noreferrer';

  const t = new Date(a.timestamp);
  const time = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

  const timeSpan = document.createElement('span');
  timeSpan.className = 'time';
  timeSpan.textContent = time;

  const sourceSpan = document.createElement('span');
  sourceSpan.className = 'source';
  sourceSpan.textContent = a.source;

  const titleSpan = document.createElement('span');
  titleSpan.className = 'title';
  titleSpan.textContent = a.title;

  el.appendChild(timeSpan);
  el.appendChild(sourceSpan);
  el.appendChild(titleSpan);
  return el;
}

function renderHeatmap(articles) {
  const container = document.getElementById('heatmap');
  container.innerHTML = '';

  // Days in corpus, newest first, capped at last 10
  const daySet = new Set(articles.map(a => a.timestamp.slice(0, 10)));
  const days = Array.from(daySet).sort().reverse().slice(0, 10).reverse();

  if (days.length === 0) return;

  // Counts: counts[role][day] = n
  const counts = {};
  for (const [role] of ROLES_ORDER) {
    counts[role] = Object.fromEntries(days.map(d => [d, 0]));
  }
  for (const a of articles) {
    const d = a.timestamp.slice(0, 10);
    if (!counts[ROLES_ORDER[0][0]].hasOwnProperty(d)) continue;
    for (const r of (a.roles || [])) {
      if (counts[r] && counts[r][d] !== undefined) counts[r][d]++;
    }
  }

  // Max cell value for color scaling
  let maxCount = 0;
  for (const [role] of ROLES_ORDER) {
    for (const d of days) {
      if (counts[role][d] > maxCount) maxCount = counts[role][d];
    }
  }
  maxCount = Math.max(maxCount, 1);

  // Header
  const header = document.createElement('div');
  header.className = 'heatmap-header';
  const title = document.createElement('div');
  title.className = 'heatmap-title';
  title.textContent = 'Discourse by role × day';
  header.appendChild(title);
  const hint = document.createElement('div');
  hint.className = 'heatmap-hint';
  if (roleFilter) {
    hint.innerHTML = `filtering: <b>${ROLES_ORDER.find(r=>r[0]===roleFilter.role)?.[1]||roleFilter.role}</b> on ${formatShort(roleFilter.day)}`;
    const pill = document.createElement('span');
    pill.className = 'filter-pill';
    pill.textContent = 'clear ×';
    pill.onclick = () => { roleFilter = null; render(); };
    hint.appendChild(pill);
  } else {
    hint.textContent = 'click any cell to filter the feed below';
  }
  header.appendChild(hint);
  container.appendChild(header);

  // Grid: 1 label col + N day cols; 1 col-label row + N role rows
  const grid = document.createElement('div');
  grid.className = 'heatmap-grid';
  grid.style.gridTemplateColumns = `110px repeat(${days.length}, 1fr)`;

  // Header row (corner + day labels)
  const corner = document.createElement('div');
  corner.className = 'hm-corner';
  grid.appendChild(corner);
  for (const d of days) {
    const lab = document.createElement('div');
    lab.className = 'hm-label-col';
    lab.textContent = formatShort(d);
    grid.appendChild(lab);
  }

  // Role rows
  for (const [roleKey, roleDisplay] of ROLES_ORDER) {
    const label = document.createElement('div');
    label.className = 'hm-label-row';
    label.textContent = roleDisplay;
    grid.appendChild(label);
    for (const d of days) {
      const n = counts[roleKey][d];
      const cell = document.createElement('div');
      cell.className = 'hm-cell';
      if (roleFilter && roleFilter.role === roleKey && roleFilter.day === d) {
        cell.classList.add('selected');
      }
      if (n > 0) {
        const intensity = 0.15 + 0.85 * (n / maxCount);
        cell.style.background = `rgba(200, 200, 200, ${intensity.toFixed(2)})`;
        cell.style.color = intensity > 0.5 ? '#111' : '#e8e8e8';
        cell.textContent = n;
      } else {
        cell.textContent = '';
      }
      cell.onclick = () => {
        if (n === 0 && !(roleFilter && roleFilter.role === roleKey && roleFilter.day === d)) return;
        if (roleFilter && roleFilter.role === roleKey && roleFilter.day === d) {
          roleFilter = null;
        } else {
          roleFilter = { role: roleKey, day: d };
        }
        render();
      };
      grid.appendChild(cell);
    }
  }
  container.appendChild(grid);
}

function formatShort(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function archiveStripe(key, arts) {
  const row = document.createElement('div');
  row.className = 'stripe';

  const label = document.createElement('div');
  label.className = 'date';
  const d = new Date(key + 'T12:00:00');
  label.textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const totalSpan = document.createElement('span');
  totalSpan.className = 'total';
  totalSpan.textContent = arts.length;
  label.appendChild(totalSpan);

  const bar = document.createElement('div');
  bar.className = 'bar';

  const counts = { red: 0, yellow: 0, green: 0 };
  for (const a of arts) counts[a.color] = (counts[a.color] || 0) + 1;
  const total = arts.length || 1;

  for (const c of ['red', 'yellow', 'green']) {
    if (!counts[c]) continue;
    const seg = document.createElement('div');
    seg.className = `seg ${c}`;
    seg.style.flex = `0 0 ${(counts[c] / total) * 100}%`;
    seg.textContent = counts[c];
    bar.appendChild(seg);
  }

  row.appendChild(label);
  row.appendChild(bar);
  return row;
}
</script>
</body>
</html>
